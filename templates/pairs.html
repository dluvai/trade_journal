{% extends "base.html" %}
{% block title %}Pairs — Felix Trade Journal{% endblock %}
{% block header_controls %}<div class="segmented" id="yearFilter"></div>{% endblock %}
{% block content %}
<div id="bestWorstPairs"></div>
<div class="panel">
  <h2>Performance by pair</h2>
  <div id="pairTable"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let ALL_TRADES = [];
let currentYear = 'all';

function render() {
  DC.renderAll(ALL_TRADES, currentYear, {
    onYearChange: (y) => { currentYear = y; render(); },
    subheadText: (n) => `${n} trades total`,
  });
}

(async function init() {
  ALL_TRADES = await DC.fetchTrades();
  render();
})();
</script>
{% endblock %}
