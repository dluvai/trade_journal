{% extends "base.html" %}
{% block title %}Change Password — SteadFast{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="panel">
  <h2>Change Password</h2>
  <form method="post">
    <div class="field" style="margin-bottom:12px;"><label>Current Password</label><input type="password" name="current_password" required></div>
    <div class="form-grid">
      <div class="field"><label>New Password</label><input type="password" name="new_password" required></div>
      <div class="field"><label>Confirm New Password</label><input type="password" name="confirm_password" required></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Update Password</button>
      <a class="iconbtn" href="{{ url_for('profile') }}">Cancel</a>
      {% if error %}<span style="color:var(--critical); font-size:12px;">{{ error }}</span>{% endif %}
      {% if success %}<span style="color:var(--good); font-size:12px;">{{ success }}</span>{% endif %}
    </div>
  </form>
</div>
{% endblock %}
